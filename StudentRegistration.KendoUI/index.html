<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Student Registration</title>

    <!--Kendo UI theme-->
    <link rel="stylesheet" href="css/default-main.css" />

    <!--Custom CSS-->
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <div class="container">
        <h1>Student Registration</h1>
        <form id="studentForm">

            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text"
                       id="firstName"
                       name="firstName"
                       required
                       validationMessage="First Name is required" />
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text"
                       id="lastName"
                       name="lastName"
                       required
                       validationMessage="Last Name is required" />
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text"
                       id="address"
                       name="address" />
            </div>

            <div class="form-group">
                <label for="dateOfBirth">Date of Birth</label>
                <input type="date"
                       id="dateOfBirth"
                       name="dateOfBirth" />
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <input id="course"
                       name="course"
                       required
                       validationMessage="Please select a course" />
            </div>

            <div class="button-group">

                <button type="submit" id="registerButton">
                    Register Student
                </button>

                <button type="reset" id="clearButton">
                    Clear
                </button>
            </div>
        </form>
    </div>

    <div class="container student-details-container">
        <div class="student-details-header">
            <h2>Registered Students</h2>

            <button type="button" 
                    id="viewStudentReportBtn"
                    class="k-button k-button-md k-rounded-md k-button-solid k-button-solid-primary" >
                <span class="k-icon k-i-file-pdf"></span>
                View Student Report
            </button>
        </div>

        <div id="studentsGrid"></div>
    </div>

    <div id="editStudentWindow" style="display:none;">
        <form id="editStudentForm">

            <input type="hidden" id="editStudentId" />

            <div class="form-group">
                <label>First Name</label>
                <input id="editFirstName" required />
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input id="editLastName" required />
            </div>

            <div class="form-group">
                <label>Address</label>
                <input id="editAddress" />
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input id="editDateOfBirth" />
            </div>

            <div class="form-group">
                <label>Course</label>
                <input id="editCourse" required />
            </div>

            <div class="button-group">
                <button type="button" id="updateStudentButton">
                    Update
                </button>

                <button type="button" id="cancelEditButton">
                    Cancel
                </button>
            </div>
        </form>
    </div>

    <span id="notification"></span>

    <!--jQuery-->
    <script src="js/jquery.min.js"></script>

    <!--Kendo UI-->
    <script src="js/kendo.all.min.js"></script>

    <script src="js/telerik-license.js"></script>

    <!--Application JavaScript-->
    <script src="js/app.js"></script>
</body>
</html>
