<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Student Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link href="css/style.css" rel="stylesheet" />

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Student Registration</h2>

        <!-- Registration form-->
        <div class="card shadow-sm mb-4">
            <div class="card-header">
                <h5 class="mb-0">Register a Student</h5>
            </div>

            <div class="card-body">
                <form id="studentForm">

                    <div class="mb-3">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" required />
                    </div>

                    <div class="mb-3">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" required />
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea class="form-control" id="address" rows="2"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="dateOfBirth" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="dateOfBirth" />
                    </div>

                    <div class="mb-3">
                        <label for="course" class="form-label">Course</label>
                        <select class="form-select" id="course" required>
                            <option value="">Select a course</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Register Student
                    </button>

                    <button type="reset" id="btnReset" class="btn btn-outline-secondary">
                        Reset
                    </button>
                </form>
            </div>
        </div>

        <!--Student List-->
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Registered Students</h5>

                <button type="button"
                        class="btn btn-outline-primary"
                        id="btnGenerateReport">
                    <i class="bi bi-file-earmark-text"></i>
                    Generate Report
                </button>
            </div>

            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-5">
                        <input type="text" id="searchStudent"
                               class="form-control"
                               placeholder="Search students..." />
                    </div>

                    <div class="col-md-4">
                        <select id="filterCourse" class="form-select">
                            <option value="0">All Courses</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <button type="button" id="btnClearFilters"
                                class="btn btn-outline-secondary w-100">
                            Clear
                        </button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover student-table">
                        <thead>
                            <tr>
                                <th>Full Name</th>
                                <th>Address</th>
                                <th>Date of Birth</th>
                                <th>Course</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>

                        <tbody id="studentTableBody">
                            <!--Students will be loaded here-->
                        </tbody>
                    </table>
                </div>

            </div>
            <nav class="mt-3 mb-3" aria-label="Student table pagination">
                <ul class="pagination justify-content-center" id="pagination">
                </ul>
            </nav>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3"
         style="z-index: 1100;">

        <div id="appToast"
             class="toast align-items-center border-0"
             role="alert"
             aria-live="assertive"
             aria-atomic="true">

            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                </div>

                <button type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast"
                        aria-label="Close">
                </button>
            </div>
        </div>
    </div>

    <!--Footer-->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">
            &copy; 2026 Student Registration System. All rights reserved.
        </p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/students.js"></script>
</body>
</html>
